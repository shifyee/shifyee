<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPhone 18 Pro GitHub README Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'], mono: ['Fira Code', 'monospace'], } } } }
    </script>
    <style>
        .iphone-frame { background: linear-gradient(145deg, #4d4f56 0%, #1c1d21 40%, #3a3c42 70%, #151618 100%); box-shadow: 0 0 0 2px #2d2e33, 0 25px 60px -15px rgba(0, 0, 0, 0.8), inset 0 0 3px 1px rgba(255, 255, 255, 0.2); }
        .ios-blur { backdrop-filter: blur(25px) saturate(180%); -webkit-backdrop-filter: blur(25px) saturate(180%); }
        .wallpaper-bg { background: radial-gradient(circle at 20% 20%, #1a2639 0%, #0d1117 50%, #05070a 100%); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .screen-container { transition: opacity 0.35s cubic-bezier(0.4, 0, 0.2, 1), transform 0.35s cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen antialiased selection:bg-cyan-500 selection:text-black">
    <main class="max-w-7xl mx-auto px-4 py-8">
        <div class="flex flex-col items-center">
            <div id="phoneShell" class="iphone-frame relative w-[390px] h-[780px] rounded-[54px] p-[11px] select-none transition-all duration-500">
                <div class="relative w-full h-full bg-black rounded-[44px] overflow-hidden border border-slate-800 flex flex-col">
                    <div class="absolute top-2 left-0 right-0 z-50 flex justify-center pointer-events-none">
                        <div id="dynamicIsland" class="bg-black text-white h-7 w-28 rounded-full flex items-center justify-between px-3 transition-all duration-300 shadow-lg border border-slate-900/60">
                            <div class="flex items-center gap-1.5"><div id="islandDot" class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div><span id="islandText" class="text-[10px] font-medium text-slate-300 hidden">GitHub</span></div>
                            <div class="w-3.5 h-3.5 rounded-full border-[1.5px] border-slate-800 bg-slate-950 flex items-center justify-center"><div class="w-1.5 h-1.5 rounded-full bg-blue-950"></div></div>
                        </div>
                    </div>

                    <div class="pt-3 px-7 pb-1 flex justify-between items-center text-xs font-semibold text-white z-40">
                        <span id="currentTime">--:--</span>
                        <div class="flex items-center gap-1.5 text-[11px]">
                            <svg class="w-4 h-4 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M12 21c-1.1 0-2-.9-2-2h4c0 1.1-.9 2-2 2zm6-4.5v-5c0-3.07-1.63-5.64-4.5-6.32V4.5c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.86 6 8.42 6 11.5v5l-2 2v1h16v-1l-2-2z"/></svg>
                            <span class="text-[10px] font-bold">5G</span>
                            <svg class="w-5 h-5 text-emerald-400" fill="currentColor" viewBox="0 0 24 24"><path d="M17 5v14c0 1.1-.9 2-2 2H9c-1.1 0-2-.9-2-2V5c0-1.1.9-2 2-2h1V1h4v2h1c1.1 0 2 .9 2 2z"/></svg>
                        </div>
                    </div>

                    <div class="relative flex-1 w-full h-full overflow-hidden">
                        <!-- STATE 0: OFF -->
                        <div id="screenOff" class="screen-container absolute inset-0 bg-black flex flex-col items-center justify-center z-30 transition-opacity duration-300">
                            <div class="text-center p-6 space-y-4">
                                <div class="w-16 h-16 rounded-full bg-slate-900/80 border border-slate-800 flex items-center justify-center mx-auto text-slate-500 animate-pulse">
                                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                                </div>
                                <p class="text-xs text-slate-500 font-mono">SYSTEM_POWER_OFF</p>
                            </div>
                        </div>

                        <!-- STATE 2: HOME SCREEN -->
                        <div id="screenHome" class="screen-container absolute inset-0 wallpaper-bg p-5 flex flex-col justify-between z-10 hidden">
                            <div class="pt-6 grid grid-cols-2 gap-3">
                                <!-- Widget 1 -->
                                <div class="p-3.5 rounded-3xl bg-slate-900/70 ios-blur border border-white/10 text-white flex flex-col justify-between h-24 shadow-lg">
                                    <div class="flex items-center justify-between"><span class="text-[10px] uppercase font-bold text-slate-400">OCTO_STATS</span></div>
                                    <div><div id="widgetCommits" class="text-xl font-bold text-white">Loading...</div><div class="text-[10px] text-emerald-400 flex items-center gap-1">Live GitHub Data</div></div>
                                </div>
                                <!-- Widget 2 -->
                                <div class="p-3.5 rounded-3xl bg-slate-900/70 ios-blur border border-white/10 text-white flex flex-col justify-between h-24 shadow-lg">
                                    <div class="flex items-center justify-between"><span class="text-[10px] uppercase font-bold text-slate-400">CURRENT</span></div>
                                    <div><div id="widgetStatus" class="text-xs font-semibold text-slate-200 line-clamp-2">Software Developer, Toolsmith</div></div>
                                </div>
                            </div>
                            
                            <!-- APP GRID WITH SVG ICONS -->
                            <div class="grid grid-cols-4 gap-4 py-4 mt-4">
                                <div class="flex flex-col items-center gap-1">
                                    <div class="w-14 h-14 rounded-2xl bg-teal-500 flex items-center justify-center text-white shadow-lg border border-white/10">
                                        <svg class="w-7 h-7" fill="currentColor" viewBox="0 0 24 24"><path d="M5 9.2h3V19H5zM10.6 5h2.8v14h-2.8zm5.6 8H19v6h-2.8z"/></svg>
                                    </div>
                                    <span class="text-[11px] text-white font-medium drop-shadow">Commits</span>
                                </div>
                                <div class="flex flex-col items-center gap-1">
                                    <div class="w-14 h-14 rounded-2xl bg-amber-500 flex items-center justify-center text-white shadow-lg border border-white/10">
                                        <svg class="w-7 h-7" fill="currentColor" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
                                    </div>
                                    <span class="text-[11px] text-white font-medium drop-shadow">README</span>
                                </div>
                                <div class="flex flex-col items-center gap-1">
                                    <div class="w-14 h-14 rounded-2xl bg-green-500 flex items-center justify-center text-white shadow-lg border border-white/10">
                                        <svg class="w-7 h-7" fill="currentColor" viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
                                    </div>
                                    <span class="text-[11px] text-white font-medium drop-shadow">Spotify</span>
                                </div>
                                <div class="flex flex-col items-center gap-1">
                                    <div class="w-14 h-14 rounded-2xl bg-blue-500 flex items-center justify-center text-white shadow-lg border border-white/10">
                                        <svg class="w-7 h-7" fill="currentColor" viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM19 18H6c-2.21 0-4-1.79-4-4s1.79-4 4-4h.71C7.37 7.69 9.48 6 12 6c3.04 0 5.5 2.46 5.5 5.5v.5H19c1.66 0 3 1.34 3 3s-1.34 3-3 3z"/></svg>
                                    </div>
                                    <span class="text-[11px] text-white font-medium drop-shadow">Weather</span>
                                </div>
                                <div class="flex flex-col items-center gap-1">
                                    <div class="w-14 h-14 rounded-2xl bg-red-600 flex items-center justify-center text-white shadow-lg border border-white/10">
                                        <svg class="w-7 h-7" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                                    </div>
                                    <span class="text-[11px] text-white font-medium drop-shadow">YouTube</span>
                                </div>
                                <div class="flex flex-col items-center gap-1 opacity-70">
                                    <div class="w-14 h-14 rounded-2xl bg-slate-600 flex items-center justify-center text-white border border-white/10">
                                        <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 8l3-3h12l3 3m-18 0v11a2 2 0 002 2h14a2 2 0 002-2V8m-18 0h18M12 16a3 3 0 100-6 3 3 0 000 6z"/></svg>
                                    </div>
                                    <span class="text-[11px] text-slate-300 font-medium">Camera</span>
                                </div>
                                <div class="flex flex-col items-center gap-1 opacity-70">
                                    <div class="w-14 h-14 rounded-2xl bg-purple-600 flex items-center justify-center text-white border border-white/10">
                                        <svg class="w-7 h-7" fill="currentColor" viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
                                    </div>
                                    <span class="text-[11px] text-slate-300 font-medium">Photos</span>
                                </div>
                                <div class="flex flex-col items-center gap-1 opacity-70">
                                    <div class="w-14 h-14 rounded-2xl bg-slate-700 flex items-center justify-center text-white border border-white/10">
                                        <svg class="w-7 h-7" fill="currentColor" viewBox="0 0 24 24"><path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.06-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.73,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.06,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.43-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.49-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/></svg>
                                    </div>
                                    <span class="text-[11px] text-slate-300 font-medium">Settings</span>
                                </div>
                            </div>
                        </div>

                        <!-- Home Bar Strip -->
                        <div class="absolute bottom-2 left-0 right-0 py-2 flex justify-center bg-transparent z-50">
                            <div class="w-32 h-1 bg-white/60 rounded-full"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // DEFAULT STATE NOW OFF
        const state = { power: 'off', locked: false, activeApp: null };
        const screens = { off: document.getElementById('screenOff'), home: document.getElementById('screenHome') }; // Omitted other apps for brevity if you still have them from the last message, ensure they are in your actual HTML.

        function updateClock() {
            const now = new Date();
            const h24 = now.getHours(), hours = h24 % 12 === 0 ? 12 : h24 % 12, minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('currentTime').innerText = `${hours}:${minutes}`;
        }
        setInterval(updateClock, 1000); updateClock();

        async function fetchGitHub() {
            try {
                const res = await fetch('https://api.github.com/users/shifyee');
                const data = await res.json();
                document.getElementById('widgetCommits').innerText = data.public_repos + " Repos";
            } catch(e) {}
        }

        window.onload = () => { fetchGitHub(); renderScreen(); };

        function renderScreen() {
            Object.values(screens).forEach(s => s && s.classList.add('hidden'));
            if (state.power === 'off') { screens.off.classList.remove('hidden'); triggerIsland('Off', 'bg-red-500'); return; }
            if (state.activeApp && screens[state.activeApp]) { screens[state.activeApp].classList.remove('hidden'); triggerIsland(state.activeApp.toUpperCase(), 'bg-cyan-500'); } 
            else { screens.home.classList.remove('hidden'); triggerIsland('Active', 'bg-emerald-500'); }
        }
        
        window.powerToggle = () => { state.power = state.power === 'on' ? 'off' : 'on'; state.locked = state.power === 'on'; renderScreen(); }
        window.unlockPhone = () => { if(state.power !== 'off') { state.locked = false; state.activeApp = null; renderScreen(); } }
        window.goHome = () => { if(state.power !== 'off') { state.locked = false; state.activeApp = null; renderScreen(); } }
        window.openApp = (app) => { if(state.power !== 'off' && !state.locked) { state.activeApp = app; renderScreen(); } }
        
        function triggerIsland(text, color) {
            const island = document.getElementById('dynamicIsland');
            document.getElementById('islandText').innerText = text;
            document.getElementById('islandText').classList.remove('hidden');
            document.getElementById('islandDot').className = `w-2 h-2 rounded-full ${color} animate-pulse`;
            island.classList.add('w-36'); setTimeout(() => island.classList.remove('w-36'), 1200);
        }
    </script>
</body>
</html>
