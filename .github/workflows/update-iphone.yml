name: Update iPhone Readme Dashboard

on:
  issues:
    types: [opened]

jobs:
  update-iphone-svg:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Process State Change Request
        run: |
          # This runs a small python script (you will need to add to your repo) 
          # to render the new phone screen state based on what button was clicked
          python3 scripts/render_iphone_svg.py "${{ github.event.issue.title }}"

      - name: Close Issue Automatically
        uses: peter-evans/close-issue@v2
        with:
          comment: "Dashboard updated! Please check the README."

      - name: Commit Updated SVG
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/iphone_state.svg
          git commit -m "update: interactive iphone state" || exit 0
          git push
