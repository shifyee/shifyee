name: Update iPhone Readme Dashboard

on:
  issues:
    types: [opened]
  workflow_dispatch: # Allows you to run it manually the very first time

jobs:
  update-iphone-image:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Allows bot to push the image
      issues: write     # Allows bot to close the issue
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium --with-deps
          
      - name: Process State & Take Screenshot
        run: |
          # Pass the clicked button to the python script
          python3 scripts/render_iphone.py "${{ github.event.issue.title }}"
          
      - name: Close Issue Automatically
        if: github.event_name == 'issues'
        uses: peter-evans/close-issue@v3
        with:
          comment: "Dashboard updated! Please check the README."
          
      - name: Commit Updated Image
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/iphone_state.png
          git commit -m "update: interactive iphone state" || exit 0
          git push
