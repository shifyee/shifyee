name: Update iPhone Readme Dashboard

on:
  issues:
    types: [opened]
  workflow_dispatch:

jobs:
  update-iphone-image:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium --with-deps
          
      - name: Process State & Take Screenshot
        run: |
          python3 scripts/render_iphone.py "${{ github.event.issue.title }}"
          
      - name: Close Issue Automatically
        if: github.event_name == 'issues'
        uses: peter-evans/close-issue@v3
        with:
          comment: "Dashboard updated! Please check the README."
          
      - name: Update README cache buster
        run: |
          TIMESTAMP=$(date +%s)
          # Replaces the old timestamp query parameter with a new one to force GitHub to reload the image
          sed -i -E "s/(iphone_state\.png\?v=)[0-9]+/\1$TIMESTAMP/" README.md || echo "No timestamp found, skipping replacement"
          
      - name: Commit Updated Image & README
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/iphone_state.png README.md
          git commit -m "update: interactive iphone state and bust cache" || exit 0
          git push
